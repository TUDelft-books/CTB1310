title: CTB1310 - Constructiemechanica 2
author: Tom van Woudenberg

execute:
  execute_notebooks: "off"                           # Replace this if you want don't have notebooks with output and you want to add notebook output during build

html:
  baseurl :  "https://oit.tudelft.nl/CTB1310/2026"
  home_page_in_navbar       : true

sphinx:                                              # Options passed on to the underlying sphinx-parser
  local_extensions:
    image_checker: _ext/
    bib_href: _ext/
    redirect_nav: _ext/
  config:
    language: nl                                     # Set language to Dutch
    redirects:
      shear_rect/les: ./instructie.html
      shear/les: ./instructie.html
      shear_dunwandig/les: ./theorie.html
      shear_force_center/les: ./instructie.html
      torsie_krachten/les: ./instructie.html
      torsie_model/les: ./instructie.html
      torsie_shear/les: ./instructie.html
      sympy/les: ./instructie.html
    html_js_files:
    - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js # Required for live code: https://teachbooks.io/manual/features/live_code.html
    thebe_config:
      use_thebe_lite: true                           # Required for live code: https://teachbooks.io/manual/features/live_code.html
      exclude_patterns: ["**/**"]
    html_theme_options:
      home_page_in_toc: true
      logo:
        text: CTB1310 - Constructiemechanica 2 2026/2027
      repository_url: "https://github.com/TUDelft-books/CTB1310/"
      path_to_docs: "book"                           # Required for edit_page_button, should be book if you're using TeachBooks package (https://github.com/TeachBooks/TeachBooks) or the TeachBooks deploy book workflow (https://teachbooks.io/manual/external/deploy-book-workflow/README.html)
      repository_branch: "2026-teacher"              # Replace when you change the name of your published branch (required for edit_page_button)
      use_repository_button: true                    # Replace with false if you don't want the repository button (i.e. if you have a private repo)
      use_edit_page_button: true
      use_issues_button : true                       # Replace with false if you don't want the issues button (i.e. if you don't want to use GitHub issues or have a private repo)
      launch_buttons:
        thebe: true                                  # Required for live code: https://teachbooks.io/manual/features/live_code.html
      announcement: "<p>This book is not the version shared with students. That one is available here <a href='https://oit.tudelft.nl/CTB1310' style='color: cyan;'>oit.tudelft.nl/CTB1310</a></p>"
# START REMOVE-FROM-RELEASE
    keep_warnings: true
# END REMOVE-FROM-RELEASE
    nitpicky: true                                   # Enables warnings for all references where the target cannot be found, configuration part of Sphinx (https://www.sphinx-doc.org/en/master/usage/configuration.html#confval-nitpicky)
    myst_enable_extensions:                          # Sets extensions to enable in the myst parser, configuration part of MyST parser (https://myst-parser.readthedocs.io/en/latest/syntax/optional.html)
      - attrs_block
      - attrs_inline
      - colon_fence
      - deflist
      - dollarmath
      - fieldlist
      - html_image
      - linkify
      - substitution
      - tasklist
      - smartquotes
      - strikethrough
      - replacements
    external_toc_exclude_missing: true               # Replace this with false if you want to build all files in the book, allowing you to refer to pages which are not included in the table of contents, configuration part of jupyterbook, configuration part of sphinx-external-toc (https://sphinx-external-toc.readthedocs.io/en/latest/intro.html)
    html_show_copyright: false                       # As the copyright is included in the author field
    html_last_updated_fmt: ''                        # Adds the date of the last update to the footer
    mathjax3_config:
      chtml: {
        mtextInheritFont: true                       # To typeset text within math prettier
      }
    named_colors_custom_colors: {'attributiongrey':[150,150,150]} # Custom colour for the attribution admonitions
    sphinx_codex_name: "Voorbeeld"
    sphinx_codex_merge_with_proof:     true # default value
    tud_change_titlesize: false
    git_show_all_authors: true
    git_untracked_check_dependencies: false          # Doesn't check date of dependencies if file is not tracked by git (yet), configuration part of Sphinx-Last-Updated-by-Git (https://github.com/TeachBooks/sphinx-last-updated-by-git)
    git_untracked_show_sourcelink: true              # Keeps sourcefiles in book when it is not tracked by git (yet), configuration part of Sphinx-Last-Updated-by-Git (https://github.com/TeachBooks/sphinx-last-updated-by-git
    git_last_updated_timezone: 'Europe/Amsterdam'    # Sets local timezone for last updated date, otherwise uses local time zone of build, configuration part of Sphinx-Last-Updated-by-Git (https://github.com/TeachBooks/sphinx-last-updated-by-git)
    git_author_aliases:
      ioskam: Iris Oskam
    git_author_exclude:
      - 'github-actions[bot]'
      - 'Lanliss'
    git_exclude_commits: []
    metadata_figure_settings:
      source:
        warn_missing: true
    teachbooks_questions:
      feedbacks:
        multiple-choice:
          multiple-select:
            correct: ["Goed gedaan!"]
            incorrect : ["Probeer het opnieuw! Je hebt minstens één verkeerde optie geselecteerd."]
            missed: ["Probeer het opnieuw! Je hebt minstens één correcte optie gemist."]
            incorrect-missed: ["Probeer het opnieuw! Je hebt minstens één verkeerde optie geselecteerd en minstens één correcte optie gemist."]
        short-answer:
          gaps:
            correct: ["Je hebt alle invulvelden correct ingevuld."]
            incorrect: ["Je hebt geen enkel invulveld correct ingevuld."]
            mixed: ["Je hebt sommige invulvelden correct ingevuld, maar ook sommige incorrect."]
            show-answer: ["De correcte antwoorden zijn hierboven weergegeven."]
  extra_extensions:                                  # Gives you a starter package of extensions to use in your book
    - teachbooks_favourites
    - sphinx_apa_references
    - sphinx_tudelft_theme
    - sphinx_reredirects

teachbooks:
  attribution_color: attributiongrey
  attribution_location: margin

bibtex_bibfiles: 
  - references.bib                                # Required for references

parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - html_image
    - linkify
    - substitution
    - tasklist
